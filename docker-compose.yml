services:
  mysql:
    image: mysql:8.0
    container_name: tp_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    # Volumen persistente: los datos de MySQL sobreviven aunque borremos y recreemos el contenedor.
    volumes:
      - mysql_data:/var/lib/mysql
      # Este segundo volumen monta nuestro script para que MySQL lo ejecute automáticamente al primer arranque.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

    # Exponemos el puerto para poder conectarse desde un cliente externo (ej. MySQL Workbench).
    ports:
      - "3306:3306"

    # El healthcheck: MySQL corre "mysqladmin ping" cada 5 segundos.
    # Cuando responde OK, el contenedor pasa a estado "healthy", y recién ahí el backend puede intentar conectarse.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - tp_network

  backend:
    build:
      context: ./backend        # Carpeta donde Docker busca el Dockerfile
      dockerfile: Dockerfile
    container_name: tp_backend
    restart: unless-stopped

    # Le pasamos las mismas variables de MySQL, así database.py las puede usar para armar la conexión.
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_HOST: mysql        # nombre del servicio, no una IP

    ports:
      - "8000:8000"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - tp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tp_frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - tp_network

# Declaración del volumen nombrado
volumes:
  mysql_data:

# La red bridge personalizada: todos los servicios que la compartan van a poder resolverse por nombre
networks:
  tp_network:
    driver: bridge